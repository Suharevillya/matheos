name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - uses: actions/cache@v4
        with:
          path: ~/.cache/matheos
          key: chrome-headless-shell-${{ runner.os }}-v1
      - run: node cli/dist/main.js install-chrome
      - run: npm test
      - run: npm run check:examples
