# index.html and the service worker are re-checked on every visit, so a deploy shows at once;
# the hashed bundles under /assets/ never change, so browsers keep them for a year.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
